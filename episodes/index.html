---
layout: default
title: 全エピソード
description: あらB.fm の全エピソード一覧。気になる話題は検索から探せます。
permalink: /episodes/
---

<div class="container discovery-archive">
  <section class="discovery-section">
    <p class="discovery-kicker">アーカイブ</p>
    <h1 class="page-title">全エピソード</h1>
    <p class="discovery-section-lead">新しい回から順に{{ site.posts.size }}本。話題や出演者で探す場合は、ページ上部の検索か<a href="{{ '/guests/' | prepend:site.github.url }}">出演者一覧</a>をどうぞ。</p>
    <div class="ep-grid">
      {% for post in site.posts %}
        {% include episode-card.html slug=post.slug %}
      {% endfor %}
    </div>
  </section>
</div>
